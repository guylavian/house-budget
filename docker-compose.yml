version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: household_budget
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: household_budget
volumes:
  postgres_data:
  mongo_data:
